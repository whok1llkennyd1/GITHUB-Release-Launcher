name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: ditto -c -k --keepParent "Release Launcher.app" ReleaseLauncher-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReleaseLauncher-universal
          path: ReleaseLauncher-universal.zip
